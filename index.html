<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de Bord - SIMNT</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    h1, h2 {
      margin-top: 0;
      color: var(--primary);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .status-badge.online { background-color: #dcfce7; color: #15803d; }
    .status-badge.offline { background-color: #fee2e2; color: #b91c1c; }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 1rem;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .hidden { display: none; }
    
    .alert {
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    .alert-error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Système LMIS - Backend Render</h1>
    <div id="apiStatus" class="status-badge offline">Connexion au serveur...</div>
  </div>

  <!-- Login Form -->
  <div class="container" id="loginCard">
    <h2>Connexion Administration</h2>
    <form id="loginForm">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" value="admin@travail.gov.dj" required>
      </div>
      <div>
        <label for="password">Mot de passe</label>
        <input type="password" id="password" value="Mohamed123" required>
      </div>
      <button type="submit">Se connecter</button>
    </form>
    <div id="loginMessage" class="alert hidden"></div>
  </div>

  <!-- Dashboard View (Shown after login) -->
  <div class="container hidden" id="dashboardCard">
    <h2>Bienvenue Administrateur</h2>
    <p>Vous êtes connecté avec succès à l'API Render.</p>
    <button id="logoutBtn" style="background-color: #ef4444;">Déconnexion</button>
  </div>

  <script>
    // Live Render API Endpoint
    const API_URL = 'https://slmt-backend-kmsm.onrender.com';

    // DOM Elements
    const apiStatus = document.getElementById('apiStatus');
    const loginCard = document.getElementById('loginCard');
    const dashboardCard = document.getElementById('dashboardCard');
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');
    const logoutBtn = document.getElementById('logoutBtn');

    // 1. Health check to test backend connection
    async function checkBackendConnection() {
      try {
        const res = await fetch(`${API_URL}/`);
        if (res.ok) {
          apiStatus.textContent = '● Serveur Connecté';
          apiStatus.className = 'status-badge online';
        } else {
          throw new Error('Erreur réseau');
        }
      } catch (err) {
        apiStatus.textContent = '● Serveur Hors Ligne';
        apiStatus.className = 'status-badge offline';
      }
    }

    // 2. Handle Login Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMessage.className = 'alert hidden';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          localStorage.setItem('token', data.token);
          showDashboard();
        } else {
          showError(data.error || 'Identifiants invalides');
        }
      } catch (error) {
        showError('Impossible de contacter le serveur.');
      }
    });

    // 3. UI Helpers
    function showError(msg) {
      loginMessage.textContent = msg;
      loginMessage.className = 'alert alert-error';
    }

    function showDashboard() {
      loginCard.classList.add('hidden');
      dashboardCard.classList.remove('hidden');
    }

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('token');
      dashboardCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
    });

    // Initialize Page
    checkBackendConnection();
    if (localStorage.getItem('token')) {
      showDashboard();
    }
  </script>
</body>
</html>
